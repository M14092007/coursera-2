<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; }
    #image {
      width: 600px;
      height: 400px;
      margin: 20px auto;
      border: 2px solid #333;
      background-color: #ddd;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #333;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border: 2px solid #333;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="image">Hover over an image below to display here.</div>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=400&q=80" alt="A cat looking up" onmouseover="upDate(this)" onmouseleave="undo()">
    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" alt="A dog looking at the camera" onmouseover="upDate(this)" onmouseleave="undo()">
    <img src="https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=400&q=80" alt="A mouse on a branch" onmouseover="upDate(this)" onmouseleave="undo()">
    <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=400&q=80" alt="A fox in the wild" onmouseover="upDate(this)" onmouseleave="undo()">
    <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=400&q=80" alt="A parrot on a branch" onmouseover="upDate(this)" onmouseleave="undo()">
  </div>

  <script src="script.js"></script>
</body>
</html>
